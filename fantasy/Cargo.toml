[package]
name = "fantasy"
version = "0.1.0"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Fantasy telegram code generator"
homepage = "https://github.com/fewensa/fantasy"
repository = "https://github.com/fewensa/fantasy"
license = "MIT"
keywords = ["fantasy", "codegen", "telegram"]
categories = ["encoding"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE",
]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[dependencies]
tl-parser = { path = "../tl-parser" }

anyhow = "1"
case = "1"
colored = "3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = "5"
tera = "1"
toml = "0.9"
typed-builder = "0.21"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
