[package]
name = "fantasy"
version = "0.1.0"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "Fantasy telegram code generator"
homepage = "https://github.com/fewensa/fantasy"
repository = "https://github.com/fewensa/fantasy"
license = "MIT"
keywords = ["fantasy", "codegen", "telegram"]
categories = ["encoding"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE",
]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[dependencies]
tl-parser = { path = "../tl-parser" }

anyhow = "1.0.104"
case = "1.0.0"
colored = "3.1.1"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 5.2.0 depends on time ^0.3.47, which requires Rust 1.88.
simple_logger = ">=5.1.0, <5.2.0"
tera = "1.20.1"
toml = "0.9.12"
typed-builder = "0.21.2"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
