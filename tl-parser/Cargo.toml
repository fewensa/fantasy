[package]
name = "tl-parser"
version = "0.1.0"
authors = ["fewensa <fewensa@protonmail.com>"]
description = "tl schema parser"
homepage = "https://github.com/fewensa/fantasy"
repository = "https://github.com/fewensa/fantasy"
license = "MIT"
keywords = ["tl", "codegen"]
categories = ["encoding"]
include = [
  "Cargo.toml",
  "**/*.rs",
  "README.md",
  "LICENSE",
]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
typed-builder = "0.21"
